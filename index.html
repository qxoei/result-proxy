<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عرض نتيجة الطالب</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f1f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #2196F3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1976D2;
        }
        #result {
            margin-top: 20px;
            text-align: right;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>نتيجة الطالب</h2>
        <input type="text" id="seatNumber" placeholder="أدخل رقم الجلوس">
        <button onclick="fetchResult()">عرض النتيجة</button>
        <div id="result"></div>
    </div>

    <script>
        async function fetchResult() {
            const seatNumber = document.getElementById('seatNumber').value.trim();
            const resultDiv = document.getElementById('result');

            if (seatNumber === "") {
                resultDiv.innerHTML = "يرجى إدخال رقم الجلوس.";
                return;
            }

            try {
                const response = await fetch('https://result-proxy.onrender.com/get-result', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ seatNumber })
                });

                const data = await response.json();
                if (data.result) {
                    resultDiv.innerHTML = `<pre>${data.result}</pre>`;
                } else {
                    resultDiv.innerHTML = "لم يتم العثور على نتيجة.";
                }
            } catch (error) {
                resultDiv.innerHTML = "حدث خطأ أثناء جلب النتيجة.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
